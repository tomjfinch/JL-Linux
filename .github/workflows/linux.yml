name: Linux build

on:
  push:
    paths:
      - 'JL.Core/**'
      - 'JL.Linux/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'JL.Core/**'
      - 'JL.Linux/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            platform: x64
          - rid: linux-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: >
          dotnet publish JL.Linux/JL.Linux.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Platform=${{ matrix.platform }}
          -p:TreatWarningsAsErrors=false
          -o out/JL-${{ matrix.rid }}

      - name: Package
        run: tar -C out -czf JL-${{ matrix.rid }}.tar.gz JL-${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: JL-${{ matrix.rid }}
          path: JL-${{ matrix.rid }}.tar.gz

  # Every build of master replaces the "latest" release, so install.sh always
  # has a public download (Actions artifacts need a GitHub login and expire).
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.tar.gz \
            --target "${{ github.sha }}" \
            --title "JL for Linux (latest build)" \
            --notes "Install or update with one command:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
          \`\`\`

          Or download the .tar.gz for your CPU (x64 for most PCs), unpack it and run \`JL\`. Built from ${{ github.sha }}." \
            --latest
